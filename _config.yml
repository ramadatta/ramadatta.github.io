# ==============================================================================
# Site Settings
# ==============================================================================
title: Sai Rama Sridatta Prakki
description: >-
  Computational biologist at Helmholtz Munich • Single-cell, lung fibrosis/IPF &
  clinical genomics • Translational multi-omics for target discovery & biomarkers.
author:
  name: Datta
  email: ramadatta.g88@gmail.com
  bio: "Computational biologist and doctoral researcher; single-cell and translational multi-omics in lung fibrosis/IPF"

url: "https://ramadatta.github.io"
baseurl: ""

# ==============================================================================
# Build Settings
# ==============================================================================
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ==============================================================================
# Sass/SCSS
# ==============================================================================
sass:
  sass_dir: _sass
  style: compressed

# ==============================================================================
# Defaults
# ==============================================================================
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# ==============================================================================
# Social Links
# ==============================================================================
social:
  github: ramadatta
  linkedin: prakki-sai-rama-sridatta-data
  email: ramadatta.g88@gmail.com

# ==============================================================================
# Theme Settings
# ==============================================================================
theme_style: dark

# ==============================================================================
# Exclude from processing
# ==============================================================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
  - .ruby-version
  - assets/img/Prakki_DP.png   # full-size original; the site uses Prakki_DP_800.jpg
