# ==============================================================================
# Site Settings
# ==============================================================================
title: Sai Rama Sridatta Prakki
description: >-
  Doctoral researcher in Bioinformatics @ Helmholtz Munich • Single-cell genomics,
  lung fibrosis & regeneration • Reproducible analyses, code, and learning in public.
author:
  name: Datta
  email: srsridatta.prakki@helmholtz-munich.de
  bio: "Doctoral researcher in bioinformatics; single-cell genomics in lung fibrosis and regeneration"

url: "https://ramadatta.github.io"
baseurl: ""

# ==============================================================================
# Build Settings
# ==============================================================================
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ==============================================================================
# Sass/SCSS
# ==============================================================================
sass:
  sass_dir: _sass
  style: compressed

# ==============================================================================
# Defaults
# ==============================================================================
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# ==============================================================================
# Social Links
# ==============================================================================
social:
  github: ramadatta
  linkedin: prakki-sai-rama-sridatta-data
  email: srsridatta.prakki@helmholtz-munich.de

# ==============================================================================
# Theme Settings
# ==============================================================================
theme_style: dark

# ==============================================================================
# Exclude from processing
# ==============================================================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
  - .ruby-version
  - assets/img/Prakki_DP.png   # full-size original; the site uses Prakki_DP_800.jpg
