<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="AT2 cells self-renew and differentiate into AT1 cells; injury recruits more AT2 cells into repair.">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #101a2f; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .title { fill: #e7eefc; font: 700 28px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .label { fill: #d6e2ff; font: 600 20px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .small { fill: #b8c7ef; font: 500 16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
      .cellAT2 { fill: #4cc9f0; stroke: #b8f0ff; stroke-width: 2; }
      .cellAT1 { fill: #ffd166; stroke: #fff2bf; stroke-width: 2; }
      .arrow { stroke: #9fb4ff; stroke-width: 4; fill: none; marker-end: url(#arrowhead); opacity: 0.95; }
      .dashed { stroke-dasharray: 10 10; opacity: 0.8; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#9fb4ff"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>

  <text class="title" x="60" y="70">Alveolar repair in one picture</text>
  <text class="small" x="60" y="100">AT2 cells can self-renew and generate AT1 cells; injury increases recruitment into a repair program.</text>

  <!-- Panel: Homeostasis -->
  <rect class="panel" x="60" y="140" width="520" height="320"/>
  <text class="label" x="90" y="185">Homeostasis</text>
  <text class="small" x="90" y="215">Small cycling subset of AT2s maintains the epithelium.</text>

  <!-- AT2 circles -->
  <circle class="cellAT2" cx="170" cy="310" r="52"/>
  <text class="label" x="146" y="318">AT2</text>
  <text class="small" x="130" y="345">surfactant</text>

  <circle class="cellAT2" cx="330" cy="260" r="34" opacity="0.55"/>
  <circle class="cellAT2" cx="420" cy="340" r="28" opacity="0.4"/>
  <circle class="cellAT2" cx="260" cy="380" r="24" opacity="0.35"/>

  <!-- AT1 -->
  <rect class="cellAT1" x="420" y="250" width="115" height="56" rx="26"/>
  <text class="label" x="448" y="287">AT1</text>
  <text class="small" x="430" y="317">thin barrier</text>

  <!-- arrows -->
  <path class="arrow" d="M222 302 C290 280, 340 260, 420 276"/>
  <path class="arrow dashed" d="M165 258 C150 230, 150 210, 170 200"/>
  <text class="small" x="110" y="245">rare cycling</text>

  <!-- Panel: Injury -->
  <rect class="panel" x="620" y="140" width="520" height="320"/>
  <text class="label" x="650" y="185">After injury</text>
  <text class="small" x="650" y="215">Many “bulk” AT2s are recruited to proliferate and differentiate.</text>

  <!-- AT2 cluster -->
  <circle class="cellAT2" cx="740" cy="310" r="52"/>
  <text class="label" x="716" y="318">AT2</text>
  <text class="small" x="690" y="345">recruited</text>

  <circle class="cellAT2" cx="840" cy="250" r="40" opacity="0.85"/>
  <circle class="cellAT2" cx="915" cy="330" r="38" opacity="0.8"/>
  <circle class="cellAT2" cx="820" cy="380" r="32" opacity="0.75"/>
  <circle class="cellAT2" cx="700" cy="380" r="28" opacity="0.65"/>
  <circle class="cellAT2" cx="980" cy="260" r="30" opacity="0.7"/>

  <!-- AT1 -->
  <rect class="cellAT1" x="980" y="350" width="120" height="56" rx="26"/>
  <text class="label" x="1008" y="387">AT1</text>

  <!-- arrows -->
  <path class="arrow" d="M790 312 C860 320, 915 345, 980 372"/>
  <path class="arrow" d="M860 260 C905 270, 945 300, 990 350"/>
  <path class="arrow dashed" d="M700 250 C675 235, 660 220, 650 205"/>
  <text class="small" x="655" y="245">injury cues</text>

  <!-- Bottom note -->
  <text class="small" x="60" y="495">Figure is conceptual (not to scale). AT2 = alveolar type 2; AT1 = alveolar type 1.</text>
</svg>

